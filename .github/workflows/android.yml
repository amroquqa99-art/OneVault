name: Android (Docker)
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Docker Compose availability
        run: docker compose version
      - name: Compile, test, lint and package using pinned Docker toolchain
        run: bash tools/docker-build.sh all
      - name: Verify APK archive exists and checksum matches
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cd app/build/outputs/apk/debug
          sha256sum -c app-debug.apk.sha256
      - name: Upload APK and SHA-256 checksum
        uses: actions/upload-artifact@v4
        with:
          name: OneVault-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
